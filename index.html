<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Video Downloader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Video Downloader</h1>
            <p>YouTube and Instagram video tools</p>
        </header>

        <section class="card">

            <label for="videoUrl">
                Paste your video URL
            </label>

            <input
                type="url"
                id="videoUrl"
                placeholder="Paste a YouTube or Instagram URL"
                autocomplete="url"
            >

            <button id="getVideoBtn">
                Get Video
            </button>

            <p id="message" class="message hidden"></p>

            <div id="loading" class="hidden">
                Processing your video. Please wait...
            </div>

            <section id="videoResult" class="hidden">

                <h2 id="videoTitle"></h2>

                <p id="videoPlatform"></p>

                <video
                    id="videoPlayer"
                    controls
                    playsinline
                    preload="metadata"
                ></video>

                <a
                    id="downloadBtn"
                    class="download-button"
                    href="#"
                    download
                >
                    Download Video
                </a>

            </section>

        </section>

        <footer>
            <p>Use only for content you are authorized to download.</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
