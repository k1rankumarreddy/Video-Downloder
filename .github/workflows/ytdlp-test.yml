name: Test yt-dlp

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Public YouTube or Instagram video URL you are authorized to download
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "build.sh"
      - ".github/workflows/ytdlp-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check runtime dependencies
        run: |
          python --version
          python -m pip show yt-dlp
          deno --version
          python -c "import imageio_ffmpeg; print('FFmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Check video extraction
        env:
          VIDEO_URL: ${{ inputs.video_url || 'https://youtube.com/shorts/nGj6xSk-h5c?si=PsAoh3il7e9JTTde' }}
        run: |
          python - <<'PY'
          import os
          import yt_dlp

          print("yt-dlp version:", yt_dlp.version.__version__)
          options = {
              "quiet": True,
              "no_warnings": False,
              "skip_download": True,
              "noplaylist": True,
              "js_runtimes": {"deno": {}},
          }

          try:
              with yt_dlp.YoutubeDL(options) as ydl:
                  info = ydl.extract_info(os.environ["VIDEO_URL"], download=False)
                  print("Extraction successful")
                  print("Title:", info.get("title", "Unknown"))
                  print("Extractor:", info.get("extractor_key", "Unknown"))
                  print("Available formats:", len(info.get("formats", [])))
          except Exception as exc:
              print("Extraction failed:", type(exc).__name__, str(exc)[:500])
              raise SystemExit(1)
          PY
