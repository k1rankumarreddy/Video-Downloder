name: Test yt-dlp

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Public YouTube or Instagram video URL you are authorized to download
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "build.sh"
      - ".github/workflows/ytdlp-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check runtime dependencies
        run: |
          python --version
          python -m pip show yt-dlp
          deno --version
          python -c "import imageio_ffmpeg; print('FFmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Test Flask API and URL validation
        run: |
          python - <<'PY'
          from app import app, validate_url

          client = app.test_client()
          response = client.get("/api/health")
          assert response.status_code == 200, response.get_data(as_text=True)
          payload = response.get_json()
          assert payload["status"] == "ok", payload
          assert payload["yt_dlp_version"], payload
          assert validate_url("https://www.youtube.com/watch?v=BaW_jenozKc") == "YouTube"
          assert validate_url("https://www.instagram.com/reel/example/") == "Instagram"
          assert validate_url("http://www.youtube.com/watch?v=BaW_jenozKc") is None
          assert validate_url("https://notyoutube.com/watch?v=BaW_jenozKc") is None
          print("Flask health endpoint and URL validation tests passed.")
          print("Health payload:", payload)
          PY

      - name: Check video extraction
        env:
          VIDEO_URL: ${{ inputs.video_url || 'https://youtube.com/shorts/nGj6xSk-h5c?si=PsAoh3il7e9JTTde' }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          python - <<'PY'
          import os
          import yt_dlp

          print("yt-dlp version:", yt_dlp.version.__version__)
          options = {
              "quiet": True,
              "no_warnings": False,
              "skip_download": True,
              "noplaylist": True,
              "js_runtimes": {"deno": {}},
          }
          if os.environ.get("YOUTUBE_COOKIES_B64"):
              import base64
              import tempfile
              cookie_text = base64.b64decode(os.environ["YOUTUBE_COOKIES_B64"], validate=True).decode("utf-8")
              if not cookie_text.lstrip().startswith(("# Netscape HTTP Cookie File", "# HTTP Cookie File")):
                  raise SystemExit("YOUTUBE_COOKIES_B64 is not a Netscape-format cookies.txt file.")
              cookie_file = tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", suffix=".txt", delete=False)
              try:
                  cookie_file.write(cookie_text)
                  cookie_file.close()
                  options["cookiefile"] = cookie_file.name
                  with yt_dlp.YoutubeDL(options) as ydl:
                      info = ydl.extract_info(os.environ["VIDEO_URL"], download=False)
                  print("Extraction successful")
                  print("Title:", info.get("title", "Unknown"))
                  print("Extractor:", info.get("extractor_key", "Unknown"))
                  print("Available formats:", len(info.get("formats", [])))
              finally:
                  os.unlink(cookie_file.name)
          else:
              try:
                  with yt_dlp.YoutubeDL(options) as ydl:
                      info = ydl.extract_info(os.environ["VIDEO_URL"], download=False)
                  print("Extraction successful")
                  print("Title:", info.get("title", "Unknown"))
                  print("Extractor:", info.get("extractor_key", "Unknown"))
                  print("Available formats:", len(info.get("formats", [])))
              except Exception as exc:
                  message = str(exc)
                  if "confirm you're not a bot" in message.lower() or "confirm you’re not a bot" in message.lower():
                      print("::warning::YouTube blocked this GitHub-hosted runner as automated traffic. Runtime and API tests passed, but live YouTube extraction is not verified. Configure a valid YOUTUBE_COOKIES_B64 Actions secret if authorized, or test from an allowed network.")
                      raise SystemExit(0)
                  print("Extraction failed:", type(exc).__name__, message[:500])
                  raise SystemExit(1)
          PY
